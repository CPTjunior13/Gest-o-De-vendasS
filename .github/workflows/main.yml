name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícones do app
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Permitir câmera para fotos dos produtos
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Sincronizar arquivos web
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: glow-vendas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
